services:
  app:
    build: .
    container_name: auth-service
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=auth-service-postgres
      - DB_PORT=5432
      - DB_NAME=auth_service_db
      - DB_USER=postgres
      - DB_PASSWORD=root
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: 'postgres:16'
    container_name: auth-service-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: auth_service_db
    ports:
      - "5433:5432"
    volumes:
      - ./authdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth_service_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge